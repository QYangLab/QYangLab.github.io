# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: LoT Lab
subtitle: Language of Thought Laboratory
author: Qianli Yang
language: en
timezone: Asia/Shanghai

# URL
url: https://QYangLab.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Site settings (livemylife theme fields)
SEOTitle: LoT Lab | Language of Thought Laboratory
email: yangqianli90@gmail.com
description: "Computational Neuroscience & Psychology at ECNU"
keyword: "computational neuroscience, probabilistic models, Bayesian brain, cognitive science"
# Alina Grubnyak — abstract neural network structure, dark blue (Unsplash, free license)
header-img: https://images.unsplash.com/photo-1545987796-200677ee1011?w=2400&q=85&auto=format&fit=crop&fm=jpg
archives-img: https://images.unsplash.com/photo-1545987796-200677ee1011?w=2400&q=85&auto=format&fit=crop&fm=jpg

# Favicon
favicon: img/favicon.png

# Signature (disabled)
signature: false

# Wave animation
wave: true

# SNS Settings — only GitHub
github_username: QYangLab

# Sidebar Settings
sidebar: true
sidebar-about-description: "We use probabilistic models and Bayesian theory to study how the brain perceives, reasons, and learns — bridging computational neuroscience, cognitive psychology, and AI."
# sidebar-avatar: img/avatar/lab_avatar.png  # photo hidden
widgets:
  - featured-tags
  - short-about
  - friends-blog

# Widget behavior
archive_type: 'monthly'
show_count: false
featured-tags: true
featured-condition-size: 0

friends: []

# Comments — all disabled
# gitalk, gitment, disqus all off

# Analytics — off
# ga_track_id:
# ba_track_id:

# Article features
anchorjs: false
top: false
wordcount: false
busuanzi: false
scroll: true
socialshare: false
viewer: false
mouseclick:
  enable: false
ribbonDynamic: false
bglinecanvas: false

# Theme color
themecolor:
  enable: true
  mode: light

# Tip
tip:
  enable: false

# Search — disabled (no zip-search plugin installed)
# search:

# Home posts tag
home_posts_tag: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - showcase/**

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page
index_generator:
  path: ''
  per_page: 6
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 12
pagination_dir: page

# Include / Exclude
include:
exclude:
ignore:

# Theme
theme: livemylife

# Deployment
deploy:
  type: git
  repo: git@github.com:QYangLab/QYangLab.github.io.git
  branch: main
